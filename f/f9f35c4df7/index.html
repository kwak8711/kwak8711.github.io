<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>오늘의 운세</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
background:#15102b;color:#eee8ff;padding:20px 16px 48px;max-width:820px;margin:0 auto}
h1{font-size:19px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.sub{font-size:13px;color:#9a8cc8;margin-bottom:20px}
img.card{width:100%;border-radius:16px;display:block;box-shadow:0 8px 32px rgba(0,0,0,.45)}
h2{font-size:14px;color:#9a8cc8;font-weight:600;letter-spacing:1px;margin:32px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
a.day{display:block;padding:13px 10px;border-radius:11px;background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.09);color:#eee8ff;text-decoration:none;text-align:center;font-size:14px}
a.day:hover{background:rgba(255,255,255,.12)}
a.day .dow{display:block;font-size:11px;color:#9a8cc8;margin-top:3px}
.empty{font-size:14px;color:#9a8cc8}
footer{margin-top:36px;font-size:12px;color:#6d5f96;text-align:center}
</style></head><body>
<h1>🔮 오늘의 운세</h1>
<div class="sub" id="today-label">불러오는 중…</div>
<img class="card" id="card" alt="오늘의 운세 카드">
<h2>지난 운세</h2>
<div class="grid" id="archive"></div>
<div class="empty" id="empty" hidden>아직 쌓인 기록이 없어요.</div>
<footer>매일 아침 자동 생성됩니다</footer>
<script>
const DOW = ['일','월','화','수','목','금','토'];
fetch('data/index.json?v=' + Date.now())
  .then(r => r.json())
  .then(list => {
    const dates = list.sort().reverse();
    if (!dates.length) { document.getElementById('empty').hidden = false; return; }
    const [latest, ...past] = dates;
    const d = new Date(latest + 'T00:00:00+09:00');
    document.getElementById('today-label').textContent =
      `${latest} (${DOW[d.getDay()]})`;
    document.getElementById('card').src = `cards/${latest}.jpg`;
    document.getElementById('archive').innerHTML = past.map(day => {
      const dd = new Date(day + 'T00:00:00+09:00');
      return `<a class="day" href="cards/${day}.jpg">${day.slice(5)}<span class="dow">${DOW[dd.getDay()]}요일</span></a>`;
    }).join('');
    if (!past.length) document.getElementById('empty').hidden = false;
  })
  .catch(() => { document.getElementById('today-label').textContent = '카드를 불러오지 못했어요.'; });
</script>
</body></html>
